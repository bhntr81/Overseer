name: release
# Pushing a tag such as v1.1.0 builds Overseer.exe on Windows and attaches it to
# that tag's GitHub release, so a Windows user downloads one file and runs it.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: .\scripts\build-exe.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Overseer.exe
          path: dist/Overseer.exe
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null; if ($LASTEXITCODE) { gh release create $env:GITHUB_REF_NAME --title "Overseer $env:GITHUB_REF_NAME" --notes "Download Overseer.exe and double-click it." }
          gh release upload $env:GITHUB_REF_NAME dist/Overseer.exe --clobber
