name: checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      # The isolation probe requires the system Python under /usr, so no setup-python here.
      - run: sudo apt-get update && sudo apt-get install -y tmux bubblewrap
      # Ubuntu 24.04 runners block unprivileged user namespaces, which bubblewrap needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: python3 scripts/check
